apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agent-orchestrator
  labels:
    app: ai-agent-orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-agent-orchestrator
  template:
    metadata:
      labels:
        app: ai-agent-orchestrator
    spec:
      containers:
        - name: ai-agent-orchestrator
          image: ai-agent-orchestrator:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "prod"
            - name: APP_PORT
              value: "8000"
            - name: LOG_LEVEL
              value: "INFO"
            - name: SCHEDULER_TIMEZONE
              value: "UTC"
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agent-orchestrator
spec:
  type: ClusterIP
  selector:
    app: ai-agent-orchestrator
  ports:
    - port: 80
      targetPort: 8000
